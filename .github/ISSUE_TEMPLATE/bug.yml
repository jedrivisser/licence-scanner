name: Bug or scanning problem
description: Something doesn't work, or a card won't scan.
body:
  - type: markdown
    attributes:
      value: >-
        **Never attach a real licence:** no photos, screenshots, saved frames (`scanner-frame-*.png`),
        barcode data or copied text from one. They hold the holder's ID number and photo. Describe the
        problem instead; the diagnostics line from `?debug=1` (camera, frame counts, px/module) is fine.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone or computer, operating system and browser
      placeholder: e.g. Pixel 8, Android 16, Chrome 142
    validations:
      required: true
  - type: textarea
    id: debug
    attributes:
      label: Diagnostics (optional)
      description: The overlay text or console lines from the scanner with ?debug=1 added to the address.
