# Tests pushes to main and dev and every pull request; on main, also publishes web/ (the whole
# site, no build step) to GitHub Pages. Needs Settings > Pages > Source:
# "GitHub Actions". Actions are pinned to commit SHAs; Dependabot bumps them.
name: Pages

on:
  push:
    branches: [main, dev] # other branches are tested through their pull request
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26 # current LTS
      - run: make test

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # A new offline-cache name per deploy, so installed apps fetch the new
      # version as one complete set (see web/sw.js).
      - name: Stamp the service worker with this commit
        run: |
          sed -i "s/const CACHE = \"sadl-shell-[^\"]*\"/const CACHE = \"sadl-shell-${GITHUB_SHA:0:12}\"/" web/sw.js
          grep -q "sadl-shell-${GITHUB_SHA:0:12}" web/sw.js
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
